<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  /* ---------- design tokens (mirrored by the Windows renderer) ---------- */
  :root {
    --accent-a: #3b82f6;
    --accent-b: #8b5cf6;
    --glass: rgba(16, 18, 26, 0.62);
    --glass-solid: rgba(14, 16, 24, 0.90);
    --line: rgba(255, 255, 255, 0.10);
    --text: #f2f4f8;
    --muted: rgba(255, 255, 255, 0.55);
    --ok: #34d399;
    --bad: #fb7185;
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: var(--text); user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; }

  #stage { position: absolute; inset: 0; }

  /* ---------- idle: slim glowing tab on the edge ---------- */
  #pill {
    position: absolute; top: 50%; right: 4px;
    width: 5px; height: 128px; margin-top: -64px;
    border-radius: 6px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.55), 0 0 2px rgba(255,255,255,0.35) inset;
    opacity: 0.85;
    transition: width .18s ease, height .18s ease, margin-top .18s ease, opacity .18s ease, box-shadow .18s ease, right .18s ease;
  }
  body.side-left #pill { right: auto; left: 4px; }
  body.mode-strip #stage:hover #pill {
    width: 7px; height: 160px; margin-top: -80px; opacity: 1;
    box-shadow: 0 0 18px rgba(99, 102, 241, 0.75), 0 0 2px rgba(255,255,255,0.45) inset;
  }
  body:not(.mode-strip) #pill { display: none; }

  /* ---------- drag-over: edge glow + "drop" card ---------- */
  #edgeGlow {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(59,130,246,0) 0%, rgba(59,130,246,0.14) 70%, rgba(139,92,246,0.30) 100%);
    transition: opacity .2s ease;
  }
  body.side-left #edgeGlow { transform: scaleX(-1); }
  body.mode-wide #edgeGlow { opacity: 1; }

  #dropCard {
    position: absolute; top: 50%; right: 12px;
    width: 140px; height: 184px; margin-top: -92px;
    border-radius: var(--radius);
    background: var(--glass-solid);
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04) inset;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    opacity: 0; transform: scale(.86) translateX(18px); pointer-events: none;
    transition: opacity .18s ease, transform .22s cubic-bezier(.2,.9,.3,1.2);
  }
  body.side-left #dropCard { right: auto; left: 12px; transform: scale(.86) translateX(-18px); }
  body.mode-wide #dropCard { opacity: 1; transform: none; }
  #dropCard .ring {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(139,92,246,.35), rgba(59,130,246,.10) 70%, transparent 72%);
    animation: spin 12s linear infinite;
  }
  #dropCard .ring svg { animation: bob 1.1s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
  #dropCard .t { font-size: 14px; font-weight: 700; letter-spacing: .01em; }
  #dropCard .s { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.3; padding: 0 12px; }

  /* ---------- panel: device picker / progress ----------
     Frost is the window's own vibrancy layer (macOS HUD / Windows acrylic);
     CSS backdrop-filter would paint the rounded corners white. */
  #panel {
    position: absolute; inset: 0; display: none; flex-direction: column;
    background: var(--glass);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: 16px 16px 14px;
    gap: 12px;
  }
  body.mode-panel #panel { display: flex; }

  .head { display: flex; align-items: center; gap: 12px; padding-right: 30px; }
  .head .mark {
    width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 6px 16px rgba(99,102,241,.45);
    display: flex; align-items: center; justify-content: center;
  }
  .head h2 { font-size: 16px; font-weight: 700; line-height: 1.15; }
  .head .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 230px; }

  #closeBtn {
    position: absolute; top: 14px; right: 14px;
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.12); color: rgba(255,255,255,.75);
    font-size: 12px; line-height: 1; cursor: pointer;
  }
  #closeBtn:hover { background: rgba(255,255,255,.22); }

  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .list::-webkit-scrollbar { width: 0; }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 14px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.07);
    cursor: pointer;
    transition: background .12s ease, transform .08s ease, border-color .12s ease;
  }
  .row:hover { background: rgba(99,102,241,.28); border-color: rgba(139,92,246,.45); }
  .row:active { transform: scale(.98); }
  .row.static { cursor: default; }
  .row.static:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.07); }
  .avatar {
    width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: #fff; letter-spacing: .02em;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .row .txt { flex: 1; min-width: 0; }
  .row .name { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: 11px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .go { color: rgba(255,255,255,.4); font-size: 18px; line-height: 1; }
  .row .tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 999px; background: rgba(255,255,255,.12); color: rgba(255,255,255,.75);
  }
  .row input {
    width: 100%; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
    border-radius: 9px; color: #fff; padding: 7px 9px; font-size: 12.5px; outline: none;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .row input:focus { border-color: var(--accent-a); }

  .xfer { padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.07); }
  .xfer .r1 { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .xfer .fico {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: rgba(255,255,255,.10); display: flex; align-items: center; justify-content: center;
  }
  .xfer .fname { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xfer .fmeta { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .xfer .pct { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
  .bar { height: 6px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,.12); }
  .bar > i { display: block; height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); transition: width .15s linear; }
  .bar.indet > i { width: 40%; animation: indet 1.2s ease-in-out infinite; }
  @keyframes indet { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .xfer.done .bar > i { background: var(--ok); }
  .xfer.done .pct { color: var(--ok); }
  .xfer.fail .bar > i { background: var(--bad); }
  .xfer.fail .pct { color: var(--bad); }
  .xfer .err { display: none; font-size: 10.5px; color: var(--bad); margin-top: 6px; line-height: 1.3; }
  .xfer.fail .err { display: block; }

  .empty {
    flex: 1; display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: 12.5px; padding: 0 16px; line-height: 1.4;
  }
  .empty .radar {
    width: 54px; height: 54px; border-radius: 50%; position: relative;
    border: 1.5px solid rgba(255,255,255,.18);
    background: radial-gradient(circle, rgba(59,130,246,.35) 0, transparent 60%);
  }
  .empty .radar::after {
    content: ""; position: absolute; inset: -1.5px; border-radius: 50%;
    border: 1.5px solid transparent; border-top-color: var(--accent-a);
    animation: spin 1.1s linear infinite;
  }

  .foot { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 9px 10px; border-radius: 11px; border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.09); cursor: pointer; font-size: 12.5px; font-weight: 600;
  }
  .btn:hover { background: rgba(255,255,255,.16); }
  .btn.primary { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.08); }

  /* ---------- join-request approval ---------- */
  #approve { display: none; flex-direction: column; gap: 14px; flex: 1; justify-content: center; }
  #approve .who { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10); }
  #approve .who .name { font-size: 15px; font-weight: 700; }
  #approve .who .meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  #approve .note { font-size: 12px; color: var(--muted); line-height: 1.45; text-align: center; padding: 0 8px; }
  #approve .acts { display: flex; gap: 10px; }
  .btn.danger { background: rgba(251,113,133,.18); border-color: rgba(251,113,133,.35); color: var(--bad); }

  /* ---------- right-click menu ---------- */
  #menu {
    position: absolute; inset: 0; display: none; flex-direction: column; gap: 4px;
    background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 10px;
  }
  body.mode-menu #menu { display: flex; }
  #menu .title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 10px 8px; }
  #menu button {
    all: unset; display: flex; align-items: center; gap: 10px;
    cursor: pointer; font-size: 13px; font-weight: 600; padding: 9px 10px; border-radius: 10px;
  }
  #menu button:hover { background: rgba(99,102,241,.30); }
  #menu button .ic { width: 18px; text-align: center; opacity: .8; }
  #menu button.danger { color: var(--bad); }
  #menu hr { border: none; border-top: 1px solid rgba(255,255,255,.10); margin: 4px 6px; }
</style>
</head>
<body class="mode-strip side-right">
  <div id="stage">
    <div id="edgeGlow"></div>
    <div id="pill"></div>

    <div id="dropCard">
      <div class="ring">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v13M6 11l6 6 6-6"/><path d="M5 20h14"/>
        </svg>
      </div>
      <div class="t">Drop to send</div>
      <div class="s">to a device nearby<br/>or in your group</div>
    </div>

    <div id="panel">
      <button id="closeBtn" title="Close">✕</button>
      <div class="head">
        <div class="mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V6M6 12l6-6 6 6"/>
          </svg>
        </div>
        <div>
          <h2 id="panelTitle">Send to</h2>
          <div class="sub" id="panelSubtitle">Choose a device nearby</div>
        </div>
      </div>
      <div class="list" id="peerList"></div>
      <div class="list" id="progressList" style="display:none"></div>
      <div id="approve">
        <div class="who"><div class="avatar" id="apAvatar"></div><div><div class="name" id="apName"></div><div class="meta" id="apMeta"></div></div></div>
        <div class="note">Approving lets this device see your group, receive your files and send you files. Only approve devices you recognise.</div>
        <div class="acts"><button class="btn danger" id="apDeny">Deny</button><button class="btn primary" id="apOk">Approve</button></div>
      </div>
      <div class="foot" id="peerFoot">
        <button class="btn" id="refreshBtn">↻ Refresh</button>
        <button class="btn" id="addIpBtn">+ Add by IP</button>
      </div>
    </div>

    <div id="menu">
      <div class="title">WhisperDrop</div>
      <button data-act="peek"><span class="ic">📡</span>Show devices</button>
      <button data-act="switch"><span class="ic">⇄</span><span id="switchLabel">Move to left edge</span></button>
      <button data-act="downloads"><span class="ic">⤓</span>Open received files</button>
      <button data-act="wizard"><span class="ic">⚙︎</span>Preferences…</button>
      <hr/>
      <button data-act="quit" class="danger"><span class="ic">⏻</span>Quit WhisperDrop</button>
    </div>
  </div>

  <script type="module">
    const { getCurrentWindow } = window.__TAURI__.window;
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const dbg = (m) => invoke('ui_debug', { msg: m }).catch(() => {});
    window.addEventListener('error', (e) => dbg(`JS-ERROR ${e.message} @${e.lineno}:${e.colno}`));
    window.addEventListener('unhandledrejection', (e) => dbg('REJECTION ' + e.reason));

    const win = getCurrentWindow();
    const $ = (id) => document.getElementById(id);
    const panelTitle = $('panelTitle'), panelSubtitle = $('panelSubtitle');
    const peerListEl = $('peerList'), progressListEl = $('progressList'), peerFoot = $('peerFoot');

    /* ---------- config ---------- */
    let SIDE = 'right', GROUP = '';
    async function loadConfig() {
      try {
        const cfg = await invoke('get_config');
        SIDE = cfg.position === 'left' ? 'left' : 'right';
        GROUP = cfg.tunnel && cfg.tunnel.enabled && cfg.tunnel.member_token ? (cfg.group_id || '') : '';
      } catch (e) { dbg('get_config failed ' + e); }
      applySide();
    }
    function applySide() {
      document.body.classList.toggle('side-left', SIDE === 'left');
      document.body.classList.toggle('side-right', SIDE !== 'left');
      $('switchLabel').textContent = SIDE === 'left' ? 'Move to right edge' : 'Move to left edge';
    }

    /* ---------- modes: strip | wide | panel | menu (geometry lives in Rust) ---------- */
    let mode = 'strip';
    let modeChain = Promise.resolve();
    function setMode(next) {
      mode = next;
      document.body.classList.remove('mode-strip', 'mode-wide', 'mode-panel', 'mode-menu');
      document.body.classList.add('mode-' + next);
      // Geometry changes are chained so a fast open→close never lands out of order.
      modeChain = modeChain.then(() => invoke('set_edge_mode', { mode: next }))
        .catch((e) => dbg('set_edge_mode failed ' + e));
      return modeChain;
    }
    const showStrip = () => setMode('strip');

    /* ---------- peer picker ---------- */
    let pendingFiles = [];
    let savedManualPeer = null; // {name, ip, port} verified via check_peer

    async function openPeerPicker(files) {
      pendingFiles = files || [];
      $('approve').style.display = 'none'; showingRequest = null;
      peerListEl.style.display = 'flex';
      progressListEl.style.display = 'none';
      progressListEl.innerHTML = '';
      peerFoot.style.display = 'flex';
      panelTitle.textContent = 'Send to';
      panelSubtitle.textContent = 'Searching nearby…';
      peerListEl.innerHTML = '<div class="empty"><div class="radar"></div>Looking for devices on your network…</div>';
      await setMode('panel');

      let peers = [];
      try { peers = await invoke('get_online_peers'); }
      catch (e) { dbg('get_online_peers failed ' + e); }
      if (mode !== 'panel') return; // closed while querying

      panelSubtitle.textContent = !pendingFiles.length
        ? 'Drop a file on the edge to send'
        : pendingFiles.length === 1
          ? `“${basename(pendingFiles[0])}”`
          : `${pendingFiles.length} files`;

      peerListEl.innerHTML = '';
      if (savedManualPeer) {
        const m = savedManualPeer;
        peerListEl.appendChild(row(avatar(m.name, 'ok'), m.name, `verified · port ${m.port}`, 'IP',
          () => { if (pendingFiles.length) startTransfer(m); }));
      }
      for (const p of peers) {
        peerListEl.appendChild(row(avatar(p.name), p.name, `${p.ip}:${p.port}`, 'LAN',
          () => { if (pendingFiles.length) startTransfer(p); }));
      }
      if (GROUP) {
        // each online member of the group, then the whole group
        let members = [];
        try { members = await invoke('get_tunnel_members'); } catch (e) { dbg('members ' + e); }
        if (mode !== 'panel') return;
        for (const m of members.filter(m => m.online)) {
          peerListEl.appendChild(row(avatar(m.name || m.device_id), m.name || m.device_id,
            `${m.device_id}${m.role === 'head' ? ' · head' : ''} · encrypted tunnel`, 'TUNNEL',
            () => { if (pendingFiles.length) startTransfer({ name: m.name || m.device_id, tunnel: true, target: m.device_id }); }));
        }
        const offline = members.filter(m => !m.online).length;
        peerListEl.appendChild(row(avatar('🌐', 'grp'), `Everyone in group ${GROUP}`,
          `${members.filter(m => m.online).length} online${offline ? ` · ${offline} offline` : ''} · encrypted tunnel`, 'GROUP',
          () => { if (pendingFiles.length) startTransfer({ name: `Group ${GROUP}`, tunnel: true, target: GROUP }); }));
      }
      if (!peerListEl.children.length) {
        peerListEl.innerHTML = '<div class="empty"><div class="radar"></div>No devices yet.<br/>Open WhisperDrop on the other machine, or add it by IP.</div>';
      }
    }

    function row(avatarEl, name, meta, tag, onClick) {
      const el = document.createElement('div');
      el.className = 'row';
      el.appendChild(avatarEl);
      const txt = document.createElement('div'); txt.className = 'txt';
      txt.innerHTML = `<div class="name">${escapeHtml(name)}</div><div class="meta">${escapeHtml(meta)}</div>`;
      el.appendChild(txt);
      if (tag) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag; el.appendChild(t); }
      const go = document.createElement('span'); go.className = 'go'; go.textContent = '›'; el.appendChild(go);
      el.onclick = onClick;
      return el;
    }

    // Monogram avatar with a hue derived from the name — same scheme as the
    // Windows renderer so a device looks identical from either side.
    const HUES = [[59,130,246],[139,92,246],[236,72,153],[245,158,11],[16,185,129],[6,182,212],[249,115,22],[99,102,241]];
    function hueFor(name) { let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0; return HUES[h % HUES.length]; }
    function avatar(name, kind) {
      const el = document.createElement('div');
      el.className = 'avatar';
      const [r, g, b] = kind === 'ok' ? [16,185,129] : kind === 'grp' ? [139,92,246] : hueFor(name);
      el.style.background = `linear-gradient(135deg, rgb(${r},${g},${b}), rgba(${r},${g},${b},.55))`;
      el.textContent = kind === 'grp' ? '🌐' : kind === 'ok' ? '✓' : monogram(name);
      return el;
    }
    function monogram(name) {
      const parts = name.trim().split(/[\s\-_.]+/).filter(Boolean);
      const s = parts.length >= 2 ? parts[0][0] + parts[1][0] : name.slice(0, 2);
      return s.toUpperCase();
    }
    function basename(p) { return p.split('/').pop().split('\\').pop(); }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtBytes(n) {
      if (!n && n !== 0) return '';
      const u = ['B','KB','MB','GB','TB']; let i = 0; let v = n;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return `${v < 10 && i ? v.toFixed(1) : Math.round(v)} ${u[i]}`;
    }

    // "+ Add device by IP" for when mDNS is blocked but direct TCP works.
    function showIpRow() {
      if ($('ipInput')) { $('ipInput').focus(); return; }
      const el = document.createElement('div');
      el.className = 'row static';
      el.innerHTML =
        `<div class="avatar" style="background:rgba(255,255,255,.14)">IP</div>` +
        `<div class="txt" style="display:flex;flex-direction:column;gap:5px">` +
        `<input id="ipInput" placeholder="192.168.1.20" spellcheck="false" />` +
        `<div class="meta" id="ipStatus">press Enter to test the connection</div></div>` +
        `<button class="btn primary" id="ipGo" style="flex:0;padding:7px 12px">Go</button>`;
      peerListEl.prepend(el);
      const input = el.querySelector('#ipInput'), status = el.querySelector('#ipStatus');
      input.focus();
      const go = async () => {
        const ip = (input.value || '').trim();
        if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { status.textContent = 'that is not an IPv4 address'; status.style.color = 'var(--bad)'; return; }
        status.textContent = 'checking…'; status.style.color = '';
        try {
          const port = await invoke('check_peer', { targetIp: ip });
          savedManualPeer = { name: ip, ip, port };
          el.replaceWith(row(avatar(ip, 'ok'), ip, `receiver found on port ${port}`, 'IP',
            () => { if (pendingFiles.length) startTransfer(savedManualPeer); }));
          if (pendingFiles.length) startTransfer(savedManualPeer);
        } catch (e) {
          dbg(`manual-ip ${ip} failed: ${e}`);
          status.textContent = 'no response — is WhisperDrop running there?'; status.style.color = 'var(--bad)';
        }
      };
      el.querySelector('#ipGo').onclick = (ev) => { ev.stopPropagation(); go(); };
      input.addEventListener('keydown', (ev) => { ev.stopPropagation(); if (ev.key === 'Enter') go(); if (ev.key === 'Escape') el.remove(); });
    }

    /* ---------- transfer + progress ---------- */
    const xfers = new Map();
    let showingRequest = null; // join request currently on screen (head only)

    async function startTransfer(peer) {
      dbg(`start-transfer ${peer.name} files=${pendingFiles.length}`);
      peerListEl.style.display = 'none';
      peerFoot.style.display = 'none';
      progressListEl.style.display = 'flex';
      progressListEl.innerHTML = '';
      xfers.clear();
      panelTitle.textContent = `Sending to ${peer.name}`;
      panelSubtitle.textContent = peer.tunnel ? (peer.target === GROUP ? 'everyone · encrypted tunnel' : 'encrypted tunnel') : peer.ip;

      const queue = [];
      for (const fp of pendingFiles) {
        const id = `x-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        const name = basename(fp);
        const el = document.createElement('div');
        el.className = 'xfer';
        el.innerHTML =
          `<div class="r1"><div class="fico">${fileGlyph(name)}</div>` +
          `<div style="flex:1;min-width:0"><div class="fname" title="${escapeHtml(name)}">${escapeHtml(name)}</div><div class="fmeta">queued</div></div>` +
          `<div class="pct">0%</div></div>` +
          `<div class="bar${peer.tunnel ? ' indet' : ''}"><i></i></div><div class="err"></div>`;
        progressListEl.appendChild(el);
        xfers.set(id, { el });
        queue.push(async () => {
          el.querySelector('.fmeta').textContent = 'sending…';
          try {
            if (peer.tunnel) {
              await invoke('send_file_tunnel', { transferId: id, target: peer.target, filePath: fp });
              finishRow(id, true);
            } else {
              await invoke('send_file', { transferId: id, targetIp: peer.ip, targetPort: peer.port, filePath: fp });
            }
          } catch (e) { finishRow(id, false, String(e)); }
        });
      }
      // One at a time keeps progress deterministic and tunnel memory bounded.
      for (const job of queue) await job();
    }

    function fileGlyph(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      const img = ['png','jpg','jpeg','gif','webp','heic','svg'], vid = ['mp4','mov','mkv','avi','webm'],
            aud = ['mp3','wav','m4a','flac','aac'], doc = ['pdf','doc','docx','txt','md','pages'],
            zip = ['zip','rar','7z','tar','gz','dmg','exe','msi'];
      const glyph = img.includes(ext) ? '🖼️' : vid.includes(ext) ? '🎬' : aud.includes(ext) ? '🎵'
        : doc.includes(ext) ? '📄' : zip.includes(ext) ? '📦' : '📁';
      return `<span style="font-size:15px">${glyph}</span>`;
    }

    function finishRow(id, ok, error) {
      const x = xfers.get(id); if (!x) return;
      x.el.classList.add(ok ? 'done' : 'fail');
      x.el.querySelector('.bar').classList.remove('indet');
      x.el.querySelector('.bar > i').style.width = '100%';
      x.el.querySelector('.pct').textContent = ok ? '✓' : '✕';
      x.el.querySelector('.fmeta').textContent = ok ? 'sent' : 'failed';
      if (!ok) x.el.querySelector('.err').textContent = error || 'transfer failed';
      const all = [...xfers.values()];
      if (all.every(v => v.el.classList.contains('done') || v.el.classList.contains('fail'))) {
        const allOk = all.every(v => v.el.classList.contains('done'));
        panelTitle.textContent = allOk ? 'Sent ✓' : 'Finished with errors';
        setTimeout(() => { if (mode === 'panel') showStrip(); }, allOk ? 2200 : 6000);
      }
    }

    await listen('transfer-progress', (e) => {
      const { transferId, sent, total } = e.payload;
      const x = xfers.get(transferId); if (!x) return;
      const pct = total ? Math.min(100, Math.floor((sent / total) * 100)) : 0;
      x.el.querySelector('.bar').classList.remove('indet');
      x.el.querySelector('.pct').textContent = pct + '%';
      x.el.querySelector('.bar > i').style.width = pct + '%';
      x.el.querySelector('.fmeta').textContent = `${fmtBytes(sent)} / ${fmtBytes(total)}`;
    });
    await listen('transfer-done', (e) => finishRow(e.payload.transferId, e.payload.ok, e.payload.error));

    /* ---------- join requests (this device is the group head) ---------- */
    const joinQueue = [];
    function showNextRequest() {
      if (showingRequest || !joinQueue.length) return;
      const r = joinQueue.shift();
      showingRequest = r;
      peerListEl.style.display = 'none'; progressListEl.style.display = 'none'; peerFoot.style.display = 'none';
      $('approve').style.display = 'flex';
      panelTitle.textContent = 'Join request';
      panelSubtitle.textContent = `wants to join group ${r.group}`;
      $('apAvatar').replaceWith(Object.assign(avatar(r.device_name || r.device_id), { id: 'apAvatar' }));
      $('apName').textContent = r.device_name || r.device_id;
      $('apMeta').textContent = `device id ${r.device_id}`;
      setMode('panel');
    }
    async function decide(approved) {
      const r = showingRequest; if (!r) return;
      $('apOk').disabled = $('apDeny').disabled = true;
      try { await invoke('group_approve', { requestId: r.request_id, approved }); }
      catch (e) { dbg('approve failed ' + e); }
      $('apOk').disabled = $('apDeny').disabled = false;
      showingRequest = null;
      $('approve').style.display = 'none';
      if (joinQueue.length) showNextRequest(); else showStrip();
    }
    $('apOk').onclick = () => decide(true);
    $('apDeny').onclick = () => decide(false);
    await listen('tunnel-join-request', (e) => {
      const r = e.payload;
      if (joinQueue.some(q => q.request_id === r.request_id) || (showingRequest && showingRequest.request_id === r.request_id)) return;
      joinQueue.push(r);
      if (mode === 'strip' || mode === 'panel' && showingRequest === null && !xfers.size) showNextRequest();
    });
    await listen('tunnel-join-decided', (e) => {
      const id = e.payload.request_id;
      const i = joinQueue.findIndex(q => q.request_id === id); if (i >= 0) joinQueue.splice(i, 1);
      if (showingRequest && showingRequest.request_id === id) { showingRequest = null; $('approve').style.display = 'none'; if (joinQueue.length) showNextRequest(); else showStrip(); }
    });
    await listen('tunnel-status', () => loadConfig());

    // Rust re-docks every window when monitors change or the side flips.
    await listen('edge-reset', (e) => {
      if (e.payload === 'left' || e.payload === 'right') { SIDE = e.payload; applySide(); }
      mode = 'strip';
      document.body.classList.remove('mode-wide', 'mode-panel', 'mode-menu');
      document.body.classList.add('mode-strip');
    });

    $('closeBtn').onclick = () => showStrip();
    $('refreshBtn').onclick = async () => {
      $('refreshBtn').textContent = '↻ Refreshing…';
      try { await invoke('refresh_tunnel_peers'); } catch (e) { dbg('refresh ' + e); }
      $('refreshBtn').textContent = '↻ Refresh';
      if (mode === 'panel') openPeerPicker(pendingFiles);
    };
    $('addIpBtn').onclick = () => showIpRow();

    /* ---------- pill interactions ---------- */
    $('stage').addEventListener('click', (e) => {
      const onStage = e.target === $('stage') || e.target === $('pill') || e.target === $('edgeGlow');
      if (mode === 'strip' && onStage) openPeerPicker([]);
      else if (mode === 'menu' && onStage) showStrip();
    });
    $('stage').addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (mode === 'strip') setMode('menu');
      else if (mode === 'menu') showStrip();
    });
    $('menu').addEventListener('click', async (e) => {
      const act = e.target.closest('button')?.dataset?.act;
      if (!act) return;
      e.stopPropagation();
      await showStrip();
      if (act === 'peek') openPeerPicker([]);
      if (act === 'wizard') invoke('open_wizard').catch(dbg);
      if (act === 'downloads') invoke('open_downloads').catch(dbg);
      if (act === 'quit') invoke('quit_app').catch(dbg);
      if (act === 'switch') {
        const next = SIDE === 'left' ? 'right' : 'left';
        await invoke('set_position', { position: next }).catch(dbg);
      }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && mode !== 'strip') showStrip(); });

    /* ---------- drag & drop ---------- */
    // Growing the window while a drag is in flight makes AppKit emit a
    // drag-leave for the old frame, so a leave only counts when the cursor
    // really is outside; a poll catches drags that end elsewhere.
    let widePoll = null;
    async function collapseIfOutside() {
      if (mode !== 'wide') return;
      let inside = false;
      try { inside = await invoke('edge_cursor_inside'); } catch (e) {}
      if (!inside && mode === 'wide') await showStrip();
    }
    await win.onDragDropEvent(async (event) => {
      const t = event.payload.type;
      if (t === 'enter') {
        if (mode === 'strip') {
          await setMode('wide');
          clearInterval(widePoll);
          widePoll = setInterval(collapseIfOutside, 250);
        }
      } else if (t === 'leave') {
        await collapseIfOutside();
      } else if (t === 'drop') {
        clearInterval(widePoll);
        await openPeerPicker(event.payload.paths || []);
      }
      if (mode !== 'wide') clearInterval(widePoll);
    });
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());

    await loadConfig();
    await showStrip();
    dbg('edge ready ' + win.label);
  </script>
</body>
</html>

[package]
name = "whisperdrop-relay"
version = "0.4.1"
description = "WebSocket relay for WhisperDrop cross-network transfers"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
